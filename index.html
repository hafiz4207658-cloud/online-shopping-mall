<script>
const SUPABASE_URL = "https://hxyrmrypwvkrndoontnj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_oACOcsBAFOMzfV9kzP-egg_p5w-Aen2";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let products = [];
let cart = JSON.parse(localStorage.getItem("osm_cart") || "[]");

const money = n => "Rs. " + Number(n || 0).toLocaleString("en-PK");
const statusBox = document.getElementById("status");

function setStatus(message) {
  statusBox.textContent = message;
}

async function loadProducts() {
  setStatus("مصنوعات لوڈ ہو رہی ہیں...");

  const { data, error } = await db.from("products")
    .select("id,name,description,price,image_url,category,stock,is_active,created_at")
    .eq("is_active", true)
    .order("created_at", { ascending: false });

  if (error) {
    console.error(error);
    setStatus("مصنوعات لوڈ نہیں ہو سکیں۔");
    document.getElementById("productsGrid").innerHTML =
      '<div class="empty">مصنوعات لوڈ کرنے میں مسئلہ ہے۔</div>';
    return;
  }

  products = data || [];
  renderProducts();
  updateCart();

  setStatus(
    products.length
      ? products.length + " مصنوعات دستیاب ہیں۔"
      : "ابھی کوئی فعال پروڈکٹ موجود نہیں۔"
  );
}

function renderProducts() {
  const q = document.getElementById("search").value.toLowerCase();
  const cat = document.getElementById("category").value;
  const sort = document.getElementById("sort").value;

  let list = products.filter(p =>
    (!cat || p.category === cat) &&
    (
      (p.name || "").toLowerCase().includes(q) ||
      (p.category || "").toLowerCase().includes(q)
    )
  );

  if (sort === "low") list.sort((a, b) => Number(a.price) - Number(b.price));
  if (sort === "high") list.sort((a, b) => Number(b.price) - Number(a.price));

  document.getElementById("productsGrid").innerHTML = list.length
    ? list.map(p => `
      <article class="product">
        <div class="photo">
          ${p.image_url ? `<img src="${escapeAttr(p.image_url)}" alt="">` : "🛍️"}
        </div>
        <div class="pbody">
          <span class="pill">${escapeHtml(p.category || "General")}</span>
          <h3>${escapeHtml(p.name || "")}</h3>
          <div class="desc">${escapeHtml(p.description || "")}</div>
          <div class="price">${money(p.price)}</div>
          <div class="actions">
            <button class="add" onclick="addToCart('${String(p.id)}')">Add to Cart</button>
            <button class="buy" onclick="buyNow('${String(p.id)}')">Buy Now</button>
          </div>
        </div>
      </article>
    `).join("")
    : '<div class="empty">اس کیٹیگری میں کوئی پروڈکٹ نہیں ملی۔</div>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s);
}

function save() {
  localStorage.setItem("osm_cart", JSON.stringify(cart));
  updateCart();
}

function findProduct(id) {
  return products.find(p => String(p.id) === String(id));
}

function addToCart(id) {
  const p = findProduct(id);
  if (!p) return;

  const item = cart.find(i => String(i.id) === String(id));

  if (item) {
    item.qty++;
  } else {
    cart.push({ id: p.id, qty: 1 });
  }

  save();
}

function buyNow(id) {
  addToCart(id);
  openCart();
}

function updateCart() {
  cart = cart.filter(i => findProduct(i.id));

  const count = cart.reduce((s, i) => s + i.qty, 0);
  document.getElementById("cartCount").textContent = count;

  let total = 0;

  document.getElementById("cartItems").innerHTML = cart.length
    ? cart.map(i => {
        const p = findProduct(i.id);
        total += Number(p.price) * i.qty;

        return `
          <div class="cartrow">
            <div class="mini">🛍️</div>
            <div style="flex:1">
              <b>${escapeHtml(p.name)}</b>
              <div>${money(p.price)}</div>
              <div class="qty">
                <button onclick="changeQty('${String(p.id)}',-1)">−</button>
                ${i.qty}
                <button onclick="changeQty('${String(p.id)}',1)">+</button>
                <button class="secondary" onclick="removeItem('${String(p.id)}')">Remove</button>
              </div>
            </div>
          </div>
        `;
      }).join("")
    : '<div class="empty">آپ کا کارٹ خالی ہے۔</div>';

  document.getElementById("cartTotal").textContent = money(total);
  document.getElementById("checkoutTotal").textContent = money(total);

  localStorage.setItem("osm_cart", JSON.stringify(cart));
}

function changeQty(id, n) {
  const x = cart.find(i => String(i.id) === String(id));

  if (x) {
    x.qty += n;

    if (x.qty <= 0) {
      cart = cart.filter(i => String(i.id) !== String(id));
    }
  }

  save();
}

function removeItem(id) {
  cart = cart.filter(i => String(i.id) !== String(id));
  save();
}

function openCart() {
  document.getElementById("cartOverlay").classList.add("show");
  updateCart();
}

function closeCart() {
  document.getElementById("cartOverlay").classList.remove("show");
}

function checkout() {
  if (!cart.length) {
    alert("آپ کا کارٹ خالی ہے۔");
    return;
  }

  closeCart();
  document.getElementById("checkoutModal").classList.add("show");
  updateCart();
}

function closeCheckout() {
  document.getElementById("checkoutModal").classList.remove("show");
}

function chooseCat(c) {
  document.getElementById("category").value = c;
  renderProducts();
  document.getElementById("products").scrollIntoView({ behavior: "smooth" });
}

document.getElementById("search").addEventListener("input", renderProducts);

document.getElementById("orderForm").addEventListener("submit", async e => {
  e.preventDefault();

  if (!cart.length) {
    alert("آپ کا کارٹ خالی ہے۔");
    return;
  }

  const btn = document.getElementById("placeOrderBtn");
  btn.disabled = true;
  btn.textContent = "انتظار کریں...";

  try {
    const form = new FormData(e.target);

    const { data, error } = await db.rpc("place_customer_order", {
      p_customer_name: String(form.get("name")).trim(),
      p_phone: String(form.get("phone")).trim(),
      p_address: String(form.get("address")).trim(),
      p_city: String(form.get("city")).trim(),
      p_items: cart.map(i => ({
        id: Number(i.id),
        quantity: Number(i.qty)
      }))
    });

    if (error) throw error;

    if (!data || !data.length) {
      throw new Error("آرڈر کی تصدیق موصول نہیں ہوئی۔");
    }

    const order = data[0];

    alert(
      "آپ کا آرڈر کامیابی سے جمع ہوگیا!\n" +
      "آرڈر نمبر: " + order.order_id +
      "\nکل رقم: " + money(order.order_total)
    );

    cart = [];
    save();
    closeCheckout();
    e.target.reset();

  } catch (err) {
    console.error(err);
    alert("آرڈر جمع نہیں ہو سکا۔ خرابی: " + err.message);

  } finally {
    btn.disabled = false;
    btn.textContent = "PLACE ORDER";
  }
});

async function trackOrder() {
  const orderId = document.getElementById("trackOrderId").value.trim();
  const phone = document.getElementById("trackPhone").value.trim();
  const result = document.getElementById("trackingResult");

  if (!orderId || !phone) {
    result.textContent = "براہ کرم آرڈر نمبر اور موبائل نمبر دونوں درج کریں۔";
    return;
  }

  result.textContent = "آرڈر چیک ہو رہا ہے، انتظار کریں...";

  const { data, error } = await db.rpc("track_customer_order", {
    p_order_id: Number(orderId),
    p_phone: phone
  });

  if (error) {
    console.error(error);
    result.textContent = "معذرت، آرڈر چیک نہیں ہو سکا۔ دوبارہ کوشش کریں۔";
    return;
  }

  if (!data || data.length === 0) {
    result.textContent = "آرڈر نہیں ملا۔ آرڈر نمبر اور موبائل نمبر دوبارہ چیک کریں۔";
    return;
  }

  const order = data[0];

  const statuses = {
    pending: "آرڈر موصول ہو گیا ہے",
    processing: "آپ کا آرڈر تیار ہو رہا ہے",
    shipped: "آپ کا آرڈر روانہ کر دیا گیا ہے",
    delivered: "آپ کا آرڈر پہنچا دیا گیا ہے",
    cancelled: "آپ کا آرڈر منسوخ ہو گیا ہے"
  };

  const status = String(order.order_status).toLowerCase();
  const date = new Date(order.order_date).toLocaleString("en-PK");

  result.textContent =
    "آرڈر نمبر: " + order.order_id +
    "\nحالت: " + (statuses[status] || order.order_status) +
    "\nکل رقم: Rs. " + order.order_total +
    "\nتاریخ: " + date;

  result.style.whiteSpace = "pre-line";
}

loadProducts();
</script>
